                    const hisVal = hisPenalties[s.his - 1];
                    let w = (type === 'a') ? {k:0.4, m:0.3} : {k:0.3, m:0.4};
                    return parseFloat(((( (s.kor*w.k) + (s.mat*w.m) + (s.tam1*0.2) + (s.tam2*0.2) + (engVal*0.1) + hisVal ) / 200) * 1000).toFixed(2));
                }
            },
            '경희대': {
                cutType: '80%',
                engScores: [0, 0, -2, -4, -8, -12, -18, -24, -30],
                hisPenalties: [0, 0, 0, 0, -2, -4, -8, -14, -20],
                calculator: function(s, type) {
                    const engVal = this.engScores[s.eng - 1];
                    const hisVal = this.hisPenalties[s.his - 1];
                    let weightedSum = 0;
                    let sciBonus = 0;
                    if (type === '인문') weightedSum = ((s.kor * 0.40 + s.mat * 0.25 + (s.tam1 + s.tam2) * 0.35) / 2) * 6;
                    else if (type === '사회') weightedSum = ((s.kor * 0.35 + s.mat * 0.35 + (s.tam1 + s.tam2) * 0.30) / 2) * 6;
                    else if (type === '자연') {
                        weightedSum = ((s.kor * 0.25 + s.mat * 0.40 + (s.tam1 + s.tam2) * 0.35) / 2) * 6;
                        if (s.tam1_type === '과탐') sciBonus += 4;
                        if (s.tam2_type === '과탐') sciBonus += 4;
                    }
                    return parseFloat((weightedSum + engVal + hisVal + sciBonus).toFixed(2));
                }
            },
            '연세대': {
                cutType: '70%',
                engScores: [100, 95, 87.5, 75, 60, 40, 25, 12.5, 5],
                hisPenalties: [0, 0, 0, 0, -0.2, -0.4, -0.6, -0.8, -1],
                calculator: function(s, type) {
                    const engVal = this.engScores[s.eng - 1];
                    const hisVal = this.hisPenalties[s.his - 1];
                    
                    let t1 = s.tam1;
                    let t2 = s.tam2;

                    // 가산점 로직: 유형1은 사탐 3%, 유형2는 과탐 3%
                    if (type === '유형1') {
                        if (s.tam1_type === '사탐') t1 *= 1.03;
                        if (s.tam2_type === '사탐') t2 *= 1.03;
                        return parseFloat((((s.kor * 1.5 + s.mat + engVal + t1 + t2 + hisVal) * 1000) / 800).toFixed(2));
                    } 
                    else if (type === '유형2') {
                        if (s.tam1_type === '과탐') t1 *= 1.03;
                        if (s.tam2_type === '과탐') t2 *= 1.03;
                        return parseFloat((((s.kor + s.mat * 1.5 + engVal + (t1 + t2) * 1.5 + hisVal) * 1000) / 900).toFixed(2));
                    } 
                    else if (type === '유형3') {
                        // 유형3은 가산점 없음
                        return parseFloat((((s.kor + s.mat + engVal + t1 + t2 + hisVal) * 1000) / 600).toFixed(2));
                    }
                    return 0;
                }

            {group:'가', univ:'고려대', field:'인문', dept:'미디어학부', cap:'2**', type:'K2', cr26:'4.00:1', cr25:'3.00:1', cut25:'', adjCut:'', comp25:'', cut26:'입력예정', comp26:'입력예정', cr24:'5.00:1', cut24:'', comp24:''},
            {group:'가', univ:'고려대', field:'자연', dept:'바이오의공학부', cap:'3**', type:'K1', cr26:'4.00:1', cr25:'3.00:1', cut25:'', adjCut:'', comp25:'', cut26:'입력예정', comp26:'입력예정', cr24:'4.00:1', cut24:'', comp24:''},
            {group:'가', univ:'고려대', field:'자연', dept:'바이오시스템의과학부', cap:'2**', type:'K1', cr26:'8.00:1', cr25:'3.00:1', cut25:'', adjCut:'', comp25:'', cut26:'입력예정', comp26:'입력예정', cr24:'5.00:1', cut24:'', comp24:''},
            {group:'가', univ:'고려대', field:'자연', dept:'보건환경융합과학부', cap:'4**', type:'K1', cr26:'7.00:1', cr25:'4.50:1', cut25:'', adjCut:'', comp25:'', cut26:'입력예정', comp26:'입력예정', cr24:'4.50:1', cut24:'', comp24:''},
            {group:'가', univ:'고려대', field:'인문', dept:'보건정책관리학부', cap:'2**', type:'K2', cr26:'6.00:1', cr25:'6.00:1', cut25:'', adjCut:'', comp25:'', cut26:'입력예정', comp26:'입력예정', cr24:'4.00:1', cut24:'', comp24:''},
            {group:'가', univ:'고려대', field:'인문', dept:'자유전공학부', cap:'3**', type:'K2', cr26:'7.00:1', cr25:'4.00:1', cut25:'', adjCut:'', comp25:'', cut26:'입력예정', comp26:'입력예정', cr24:'5.00:1', cut24:'', comp24:''},
            {group:'가', univ:'고려대', field:'자연', dept:'스마트보안학부', cap:'2**', type:'K1', cr26:'3.00:1', cr25:'5.00:1', cut25:'', adjCut:'', comp25:'', cut26:'입력예정', comp26:'입력예정', cr24:'3.00:1', cut24:'', comp24:''},
            {group:'가', univ:'고려대', field:'자연', dept:'심리학부', cap:'1**', type:'K1', cr26:'5.00:1', cr25:'3.00:1', cut25:'', adjCut:'', comp25:'', cut26:'입력예정', comp26:'입력예정', cr24:'5.00:1', cut24:'', comp24:''}
        ];
        let currentGroup = '전체', sortState = { key: 'none', order: 'desc' };

        // 검색이나 필터링 시 첫 페이지로 리셋
        function resetPageAndRender() {
            currentPage = 1;
            renderTable();
        }

        function filterGroup(g) {
            currentGroup = g;
            resetPageAndRender();
        }

function renderTable() {
            const tbody = document.getElementById('dataTable');
            const s = { 
                kor: Number(document.getElementById('kor').value), 
                mat: Number(document.getElementById('mat').value), 
                tam1: Number(document.getElementById('tam1').value), 
                tam2: Number(document.getElementById('tam2').value),
                tam1_type: document.getElementById('tam1_type').value,
                tam2_type: document.getElementById('tam2_type').value,
                eng: Number(document.getElementById('eng').value), 
                his: Number(document.getElementById('his').value) 
            };
            
            let processed = rawData.map(d => {
                const config = univConfigs[d.univ] || univConfigs['건국대'];
                const myScore = config.calculator(s, d.type);
                
                let targetCut = 0;
                if (d.cut26 && d.cut26 !== '입력예정' && d.cut26 !== '자료없음') {
                    targetCut = parseFloat(d.cut26);
                } else if (d.cut25 && d.cut25 !== '입력예정' && d.cut25 !== '자료없음') {
                    targetCut = parseFloat(d.cut25);
                } else if (d.adjCut && d.adjCut !== '') {
                    targetCut = parseFloat(d.adjCut);
                } else if (d.cut24 && d.cut24 !== '입력예정' && d.cut24 !== '자료없음') {
                    targetCut = parseFloat(d.cut24);
                }

                const diff = targetCut !== 0 ? myScore - targetCut : -999;
                return { ...d, myScore, targetCut, diff };
            });

            let filtered = processed.filter(d => 
                (currentGroup === '전체' || d.group === currentGroup) && 
                d.univ.includes(document.getElementById('searchUniv').value) && 
                d.dept.includes(document.getElementById('searchDept').value)
            );

            // 중요: 자르기(slice) 전에 정렬(sort)을 먼저 해야 전체 데이터가 정렬됩니다.
            if (sortState.key !== 'none') {
                filtered.sort((a, b) => {
                    let valA = a[sortState.key];
                    let valB = b[sortState.key];
                    const nA = parseFloat(valA);
                    const nB = parseFloat(valB);
                    if (!isNaN(nA) && !isNaN(nB)) {
                        return sortState.order === 'asc' ? nA - nB : nB - nA;
                    }
                    return sortState.order === 'asc' ? String(valA).localeCompare(String(valB)) : String(valB).localeCompare(String(valA));
                });
            }

            const totalRows = filtered.length;
            const totalPages = Math.ceil(totalRows / rowsPerPage);
            if (currentPage > totalPages && totalPages > 0) currentPage = totalPages;

            const startIndex = (currentPage - 1) * rowsPerPage;
            const pagedData = filtered.slice(startIndex, startIndex + rowsPerPage);

            tbody.innerHTML = pagedData.map(item => {
                const status = item.targetCut !== 0 ? getStatusLabel(item.diff) : { label: '진단불가', class: 'text-slate-300' };
                return `
                <tr class="border-t hover:bg-slate-50 cursor-pointer" onclick="showModal('${item.univ}', '${item.dept}')">
                    <td class="p-4"><span class="group-tag-${item.group} px-2 py-0.5 rounded text-[10px] font-black uppercase">${item.group}</span></td>
                    <td class="p-4 text-sm font-black">${item.univ}</td>
                    <td class="p-4 font-bold text-slate-700 underline text-sm">${item.dept}</td>
                    <td class="p-4 font-bold text-slate-500 text-xs">${item.cap}명</td>
                    <td class="p-4 text-xs ${status.class}">${status.label}</td>
                    <td class="p-4 text-right text-sm font-medium text-slate-600">${item.myScore.toFixed(2)}</td>
                    <td class="p-4 text-right font-bold text-sm">
                        ${item.targetCut > 0 ? (item.adjCut && item.targetCut === parseFloat(item.adjCut) ? item.adjCut + '*' : item.targetCut) : '입력예정'}
                    </td>
                </tr>`;
            }).join('');

            renderPagination(totalPages);
        }

        // 페이지네이션 UI 생성
        function renderPagination(totalPages) {
            const container = document.getElementById('pagination');
            if (totalPages <= 1) {
                container.innerHTML = '';
                return;
            }

            let html = `
                <button onclick="changePage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''} class="page-btn px-3 py-1 border rounded-lg">이전</button>
            `;

            for (let i = 1; i <= totalPages; i++) {
                html += `
                    <button onclick="changePage(${i})" class="page-btn px-3 py-1 border rounded-lg ${i === currentPage ? 'active' : ''}">${i}</button>
                `;
            }

            html += `
                <button onclick="changePage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''} class="page-btn px-3 py-1 border rounded-lg">다음</button>
            `;

            container.innerHTML = html;
        }

        function changePage(p) {
            currentPage = p;
            renderTable();
            window.scrollTo({ top: 0, behavior: 'smooth' }); // 페이지 이동 시 상단으로
        }

        function getStatusLabel(diff) {
            if (diff >= 7) return { label: '매우안정', class: 'status-v-safe' };
            if (diff >= 3) return { label: '안정', class: 'status-safe' };
            if (diff >= -1) return { label: '적정', class: 'status-normal' };
            if (diff >= -4) return { label: '소신', class: 'status-caution' };
            return { label: '위험', class: 'status-danger' };
        }

function sortData(key) {
            if (sortState.key === key) {
                sortState.order = sortState.order === 'asc' ? 'desc' : 'asc';
            } else {
                sortState.key = key;
                sortState.order = 'desc';
            }
            currentPage = 1; // 정렬 버튼을 누르면 무조건 1페이지로 이동하게 합니다.
            renderTable();
        }
function showModal(univ, dept) {
    const item = rawData.find(d => d.univ === univ && d.dept === dept);
    if (!item) return;

    const config = univConfigs[univ] || { cutType: '70%' };
    document.querySelectorAll('.cut-label').forEach(el => {
        el.innerText = `입결(${config.cutType})`;
    });

    document.getElementById('m-dept').innerText = item.dept;
    document.getElementById('m-univ').innerText = `${item.univ} | ${item.group}군`;

    // 2026 데이터
    document.getElementById('m-cr26').innerText = item.cr26 || '입력예정';
    document.getElementById('m-cut26').innerText = item.cut26 || '입력예정';
    document.getElementById('m-comp26').innerText = item.comp26 || '입력예정';

    // 2025 데이터 (25컷 없으면 조정컷 표시 로직)
    document.getElementById('m-cr25').innerText = item.cr25 || '자료없음';

    let displayCut25 = item.cut25;
    // 25년 데이터가 비어있거나 '자료없음'인 경우 조정컷 확인
    if (!displayCut25 || displayCut25 === '자료없음' || displayCut25 === '입력예정') {
        if (item.adjCut) {
            displayCut25 = item.adjCut + '*'; // 조정컷에 * 붙여서 표시
        } else {
            displayCut25 = '자료없음';
        }
    }
    document.getElementById('m-cut25').innerText = displayCut25;
    document.getElementById('m-comp25').innerText = item.comp25 || '자료없음';

    // 2024 데이터
    document.getElementById('m-cr24').innerText = item.cr24 || '자료없음';
    document.getElementById('m-cut24').innerText = item.cut24 || '자료없음';
    document.getElementById('m-comp24').innerText = item.comp24 || '자료없음';

    document.getElementById('modal').style.display = 'flex';
}

        function closeModal() { document.getElementById('modal').style.display = 'none'; }

        window.onload = renderTable;
    </script>
