<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>기회균형 정시 통합 모의지원 시스템</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700&display=swap');
        body { font-family: 'Pretendard', sans-serif; background-color: #f8fafc; color: #1e293b; }
        .group-tag-가, .group-tag-나, .group-tag-다 { background-color: #ffffff; color: #1e293b; border: 1px solid #e2e8f0; }
        .status-v-safe { color: #1d4ed8; font-weight: 900; } 
        .status-safe { color: #2563eb; font-weight: 900; }   
        .status-normal { color: #1e293b; font-weight: 900; } 
        .status-caution { color: #ea580c; font-weight: 900; } 
        .status-danger { color: #dc2626; font-weight: 900; }  
        /* 페이지네이션 스타일 */
        .page-btn { padding: 0.25rem 0.75rem; border: 1px solid #e2e8f0; border-radius: 0.5rem; font-size: 0.875rem; font-weight: 700; transition: all 0.2s; }
        .page-btn.active { background-color: #1e293b; color: white; border-color: #1e293b; }
        .page-btn:disabled { opacity: 0.3; cursor: not-allowed; }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-6xl mx-auto">
        <header class="mb-8 border-l-4 border-slate-800 pl-4">
            <h1 class="text-3xl font-bold tracking-tight">🎯 기회균형 정시 통합 모의지원</h1>
            <p class="text-slate-500 mt-1 font-medium italic">학과를 클릭하여 3개년 상세 데이터를 확인하세요.</p>
        </header>

        <section class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 mb-8">
            <h2 class="text-lg font-semibold mb-4 flex items-center"><span class="mr-2">📝</span> 내 수능 성적 입력</h2>
            <div class="grid grid-cols-2 md:grid-cols-6 gap-4">
                <div><label class="block text-xs font-bold text-slate-500 mb-1">국어(표점)</label><input type="number" id="kor" value="130" class="w-full p-2.5 border rounded-xl outline-none border-slate-200"></div>
                <div><label class="block text-xs font-bold text-slate-500 mb-1">수학(표점)</label><input type="number" id="mat" value="130" class="w-full p-2.5 border rounded-xl outline-none border-slate-200"></div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 mb-1">탐구1(표점)</label>
                    <input type="number" id="tam1" value="65" class="w-full p-2.5 border rounded-xl outline-none border-slate-200 mb-2">
                    <select id="tam1_type" class="w-full p-2 border rounded-lg text-xs outline-none border-slate-200">
                        <option value="사탐">사탐</option><option value="과탐">과탐</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 mb-1">탐구2(표점)</label>
                    <input type="number" id="tam2" value="65" class="w-full p-2.5 border rounded-xl outline-none border-slate-200 mb-2">
                    <select id="tam2_type" class="w-full p-2 border rounded-lg text-xs outline-none border-slate-200">
                        <option value="사탐">사탐</option><option value="과탐" selected>과탐</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 mb-1">영어(등급)</label>
                    <select id="eng" class="w-full p-2.5 border rounded-xl border-slate-200">
                        <option value="1">1등급</option><option value="2">2등급</option><option value="3">3등급</option>
                        <option value="4">4등급</option><option value="5">5등급</option><option value="6">6등급</option>
                        <option value="7">7등급</option><option value="8">8등급</option><option value="9">9등급</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 mb-1">한국사(등급)</label>
                    <select id="his" class="w-full p-2.5 border rounded-xl border-slate-200">
                        <option value="1">1등급</option><option value="2">2등급</option><option value="3">3등급</option>
                        <option value="4">4등급</option><option value="5">5등급</option><option value="6">6등급</option>
                        <option value="7">7등급</option><option value="8">8등급</option><option value="9">9등급</option>
                    </select>
                </div>
            </div>
            <button onclick="resetPageAndRender()" class="mt-4 w-full bg-slate-800 text-white font-bold py-3 rounded-xl hover:bg-slate-700 transition shadow-lg">환산점수 업데이트</button>
        </section>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
            <div class="flex gap-2 bg-white p-2 rounded-xl border border-slate-200 overflow-x-auto">
                <button onclick="filterGroup('전체')" class="px-4 py-1 bg-slate-100 rounded-lg text-xs font-bold shrink-0">전체</button>
                <button onclick="filterGroup('가')" class="px-4 py-1 border border-slate-200 rounded-lg text-xs font-bold shrink-0">가</button>
                <button onclick="filterGroup('나')" class="px-4 py-1 border border-slate-200 rounded-lg text-xs font-bold shrink-0">나</button>
                <button onclick="filterGroup('다')" class="px-4 py-1 border border-slate-200 rounded-lg text-xs font-bold shrink-0">다</button>
            </div>
            <input type="text" id="searchUniv" onkeyup="resetPageAndRender()" placeholder="대학명 검색..." class="p-3 bg-white border border-slate-200 rounded-xl outline-none text-sm shadow-sm">
            <input type="text" id="searchDept" onkeyup="resetPageAndRender()" placeholder="학과명 검색..." class="p-3 bg-white border border-slate-200 rounded-xl outline-none text-sm shadow-sm">
        </div>

        <div class="overflow-hidden bg-white rounded-2xl shadow-sm border border-slate-200 mb-4">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-slate-50 text-slate-500 text-xs tracking-wider border-b">
                        <th class="p-4 font-bold">군</th>
                        <th class="p-4 font-bold">대학</th>
                        <th class="p-4 font-bold">학과명</th>
                        <th class="p-4 font-bold cursor-pointer hover:bg-slate-100 select-none" onclick="sortData('cap')">인원 ↕</th>
                        <th class="p-4 font-bold cursor-pointer hover:bg-slate-100 select-none" onclick="sortData('diff')">결과 ↕</th>
                        <th class="p-4 font-bold text-right">내 점수</th>
                        <th class="p-4 font-bold text-right">예상 컷</th>
                    </tr>
                </thead>
                <tbody id="dataTable"></tbody>
            </table>
        </div>

        <div id="pagination" class="flex justify-center items-center gap-2 mb-8"></div>
        
        <div class="px-2 space-y-1 pb-10">
            <p class="text-[11px] text-slate-400 font-medium italic">*표시는 농어촌 전형 보정값입니다.</p>
            <p class="text-[11px] text-slate-400 font-medium italic">**표시는 계열별 선발로 각 학과의 최대 인원수입니다.</p>
            <p class="text-[11px] text-slate-500 font-bold">※ 결과 기준: <span class="status-v-safe">매우안정(+7)</span>, <span class="status-safe">안정(+3)</span>, <span class="status-normal">적정(-1)</span>, <span class="status-caution">소신(-4)</span>, <span class="status-danger">위험(-4미만)</span></p>
        </div>
    </div>

    <!-- 상세정보 모달 -->
    <div id="modal" class="fixed inset-0 bg-slate-900/60 hidden items-center justify-center p-4 z-50 backdrop-blur-sm">
        <div class="bg-white w-full max-w-sm rounded-3xl p-8 relative shadow-2xl max-h-[90vh] overflow-y-auto">
            <button onclick="closeModal()" class="absolute top-6 right-6 text-slate-400 hover:text-slate-600 text-2xl">✕</button>
            <h3 id="m-dept" class="text-2xl font-black text-slate-800 mb-1"></h3>
            <p id="m-univ" class="text-slate-800 font-bold mb-6 italic"></p>
            <div class="space-y-4" id="modal-content">
                <div class="p-4 bg-blue-50 rounded-2xl border border-blue-100">
                    <p class="text-blue-600 text-[10px] font-black uppercase mb-2">2026학년도 데이터 (예정)</p>
                    <div class="grid grid-cols-3 gap-2 text-center">
                        <div><span class="block text-[9px] text-slate-400 font-bold">경쟁률</span><span id="m-cr26" class="text-xs font-bold text-slate-700"></span></div>
                        <div><span class="block text-[9px] text-slate-400 font-bold cut-label">입결</span><span id="m-cut26" class="text-xs font-bold text-slate-700"></span></div>
                        <div><span class="block text-[9px] text-slate-400 font-bold">충원</span><span id="m-comp26" class="text-xs font-bold text-slate-700"></span></div>
                    </div>
                </div>
                <div class="p-4 bg-slate-50 rounded-2xl border border-slate-100">
                    <p class="text-slate-500 text-[10px] font-black uppercase mb-2">2025학년도 데이터</p>
                    <div class="grid grid-cols-3 gap-2 text-center">
                        <div><span class="block text-[9px] text-slate-400 font-bold">경쟁률</span><span id="m-cr25" class="text-xs font-bold text-slate-600"></span></div>
                        <div><span class="block text-[9px] text-slate-400 font-bold cut-label">입결</span><span id="m-cut25" class="text-xs font-bold text-slate-600"></span></div>
                        <div><span class="block text-[9px] text-slate-400 font-bold">충원</span><span id="m-comp25" class="text-xs font-bold text-slate-600"></span></div>
                    </div>
                </div>
                <div class="p-4 bg-slate-50 rounded-2xl border border-slate-100">
                    <p class="text-slate-500 text-[10px] font-black uppercase mb-2">2024학년도 데이터</p>
                    <div class="grid grid-cols-3 gap-2 text-center">
                        <div><span class="block text-[9px] text-slate-400 font-bold">경쟁률</span><span id="m-cr24" class="text-xs font-bold text-slate-600"></span></div>
                        <div><span class="block text-[9px] text-slate-400 font-bold cut-label">입결</span><span id="m-cut24" class="text-xs font-bold text-slate-600"></span></div>
                        <div><span class="block text-[9px] text-slate-400 font-bold">충원</span><span id="m-comp24" class="text-xs font-bold text-slate-600"></span></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 스크립트 연결 순서가 중요합니다! (의존성 순서) -->
    <script src="js/data.js"></script>
    <script src="js/calculators.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
